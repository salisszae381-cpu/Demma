<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Demma · Messagerie</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background: #f0f2f5; }

        .messaging-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            height: calc(100vh - 140px);
            min-height: 500px;
            margin: 20px 0;
        }

        .conv-list {
            background: #fff;
            border-radius: 24px;
            padding: 20px 16px;
            overflow-y: auto;
            border: 1px solid #e8eef6;
        }
        .conv-list h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--noir);
            margin-bottom: 16px;
            padding: 0 8px;
        }
        .conv-search {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--gris-clair);
            border-radius: 30px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 12px;
            background: #fafcff;
            color: var(--noir);
        }
        .conv-search:focus {
            outline: none;
            border-color: var(--rouge);
        }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.15s;
            margin-bottom: 4px;
        }
        .conv-item:hover { background: #f5f8ff; }
        .conv-item.active {
            background: var(--noir);
            color: #fff;
        }
        .conv-item.active .conv-name,
        .conv-item.active .conv-last { color: #fff; }
        .conv-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--noir);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .conv-item.active .conv-avatar { border: 2px solid #fff; }
        .conv-info { flex: 1; min-width: 0; }
        .conv-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--noir);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-last {
            font-size: 12px;
            color: var(--gris-texte);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--gris-texte);
            font-size: 14px;
        }
        .conv-empty i {
            font-size: 36px;
            color: #c5d2e0;
            margin-bottom: 12px;
            display: block;
        }

        .chat-window {
            background: #fff;
            border-radius: 24px;
            border: 1px solid #e8eef6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--gris-tres-clair);
            background: #fafdff;
        }
        .chat-header .conv-avatar {
            width: 42px;
            height: 42px;
            font-size: 16px;
        }
        .chat-header .info { flex: 1; min-width: 0; }
        .chat-header .name {
            font-weight: 700;
            font-size: 15px;
            color: var(--noir);
        }
        .chat-header .status {
            font-size: 12px;
            color: var(--gris-texte);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a0b4c8;
        }
        .chat-header .status.online .dot { background: #1e5a2f; }
        .chat-header .status.typing .dot {
            background: var(--rouge);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .chat-header .actions { display: flex; gap: 8px; }
        .chat-header .actions button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #f0f4fc;
            color: var(--noir);
            cursor: pointer;
            font-size: 16px;
            transition: 0.15s;
        }
        .chat-header .actions button:hover {
            background: var(--noir);
            color: #fff;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafdff;
        }
        .msg-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .msg-row.me { flex-direction: row-reverse; }
        .msg-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 18px;
            background: #fff;
            border: 1px solid #e8eef6;
            font-size: 14px;
            line-height: 1.5;
            color: var(--noir);
            word-wrap: break-word;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .msg-row.me .msg-bubble {
            background: var(--noir);
            color: #fff;
            border-color: var(--noir);
        }
        .msg-bubble.audio {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
        }
        .msg-bubble img {
            max-width: 100%;
            border-radius: 12px;
            display: block;
        }
        .msg-bubble video {
            max-width: 100%;
            border-radius: 12px;
            display: block;
        }
        .msg-bubble audio { max-width: 220px; }
        .msg-bubble .file-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: inherit;
        }
        .msg-bubble .file-link i { font-size: 20px; }
        .msg-time {
            font-size: 10px;
            color: var(--gris-texte);
            margin-top: 4px;
        }
        .msg-row.me .msg-time {
            color: #a0b8d4;
            text-align: right;
        }

        .chat-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--gris-texte);
            font-size: 14px;
        }
        .chat-empty i {
            font-size: 48px;
            color: #c5d2e0;
            margin-bottom: 12px;
            display: block;
        }

        .chat-input {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--gris-tres-clair);
            background: #fff;
        }
        .chat-input .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #f0f4fc;
            color: var(--noir);
            cursor: pointer;
            font-size: 16px;
            transition: 0.15s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .chat-input .btn-icon:hover {
            background: var(--noir);
            color: #fff;
        }
        .chat-input .btn-attach-label {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #f0f4fc;
            color: var(--noir);
            cursor: pointer;
            font-size: 16px;
            transition: 0.15s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .chat-input .btn-attach-label:hover {
            background: var(--noir);
            color: #fff;
        }
        .chat-input .btn-attach-label:active { transform: scale(0.95); }
        .chat-input input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid var(--gris-clair);
            border-radius: 30px;
            font-size: 15px;
            font-family: inherit;
            background: #fafcff;
            color: var(--noir);
            min-width: 0;
        }
        .chat-input input[type="text"]:focus {
            outline: none;
            border-color: var(--rouge);
            background: #fff;
        }
        .chat-input .btn-send {
            background: var(--noir);
            color: #fff;
        }
        .chat-input .btn-send:hover { background: var(--noir-clair); }

        .recording-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 22, 40, 0.85);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            gap: 20px;
        }
        .recording-overlay.show { display: flex; }
        .recording-overlay i {
            font-size: 64px;
            color: var(--rouge);
            animation: pulse 1s infinite;
        }
        .recording-overlay p {
            font-size: 18px;
            font-weight: 600;
        }
        .recording-overlay .timer {
            font-size: 32px;
            font-weight: 700;
            font-family: monospace;
        }
        .recording-overlay .actions {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }
        .recording-overlay .actions button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .recording-overlay .actions .cancel {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
        }
        .recording-overlay .actions .send {
            background: var(--rouge);
            color: #fff;
        }

        .no-chat-selected {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--gris-texte);
            text-align: center;
            padding: 40px;
        }
        .no-chat-selected i {
            font-size: 64px;
            color: #c5d2e0;
            margin-bottom: 16px;
        }
        .no-chat-selected h3 {
            color: var(--noir);
            font-size: 20px;
            margin-bottom: 6px;
        }

        /* ---- Fiche profil ---- */
        .profile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 22, 40, 0.7);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .profile-overlay.show { display: flex; }
        .profile-box {
            background: #fff;
            border-radius: 32px;
            padding: 32px 28px;
            max-width: 500px;
            width: 100%;
            position: relative;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        .profile-box .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #f5f0f0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            color: var(--rouge);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-box .big-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--noir);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            margin: 0 auto 16px;
            background-size: cover;
            background-position: center;
            border: 4px solid #f0f2f5;
        }
        .profile-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--noir);
            margin-bottom: 4px;
        }
        .profile-box .subtitle {
            color: var(--gris-texte);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .profile-info-list {
            text-align: left;
            background: #fafdff;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            border: 1px solid #e8eef6;
        }
        .profile-info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eef3f9;
            font-size: 14px;
        }
        .profile-info-row:last-child { border-bottom: none; }
        .profile-info-row .label {
            color: var(--gris-texte);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-info-row .label i {
            color: var(--rouge);
            width: 18px;
        }
        .profile-info-row .value {
            color: var(--noir);
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .profile-info-row .value a {
            color: var(--rouge);
            text-decoration: none;
        }
        .profile-info-row .value a:hover { text-decoration: underline; }

        .profile-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .profile-actions button {
            flex: 1;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.15s;
            min-width: 130px;
        }
        .btn-add-friend {
            background: var(--noir);
            color: #fff;
        }
        .btn-add-friend:hover { background: var(--noir-clair); }
        .btn-accept-friend {
            background: #e8f5e9;
            color: #1e5a2f;
            border: 1.5px solid #a5d6a7 !important;
        }
        .btn-accept-friend:hover { background: #1e5a2f; color: #fff; }
        .btn-reject-friend {
            background: #fdecea;
            color: var(--rouge);
            border: 1.5px solid #f5c6c6 !important;
        }
        .btn-reject-friend:hover { background: var(--rouge); color: #fff; }
        .btn-remove-friend {
            background: #f0f2f5;
            color: var(--gris-texte);
        }
        .btn-remove-friend:hover { background: #fdecea; color: var(--rouge); }
        .btn-message-friend {
            background: var(--rouge);
            color: #fff;
        }
        .btn-message-friend:hover { background: #a03020; }

        .friend-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .friend-badge.accepted { background: #e8f5e9; color: #1e5a2f; }
        .friend-badge.pending-sent { background: #fff4e0; color: #8b5a00; }
        .friend-badge.pending-received { background: #e8f0fa; color: #1a4a7a; }

        @media (max-width: 768px) {
            .messaging-container {
                grid-template-columns: 1fr;
                height: auto;
                min-height: calc(100vh - 140px);
            }
            .conv-list { max-height: 240px; }
            .chat-window {
                height: calc(100vh - 200px);
                min-height: 500px;
            }
            .msg-bubble { max-width: 85%; }
            .profile-box { padding: 24px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-arrows-rotate"></i>
                <a href="index.html"><h1>Demma<span>.</span></h1></a>
            </div>
            <div class="nav-right">
                <a href="fil-actualite.html" class="btn-outline">
                    <i class="fas fa-arrow-left"></i>
                    <span>Fil d'actualité</span>
                </a>
                <a href="profil.html" class="btn-outline">
                    <i class="fas fa-user"></i>
                    <span>Mon profil</span>
                </a>
            </div>
        </nav>

        <div class="messaging-container">

            <div class="conv-list">
                <h3><i class="fas fa-comments"></i> Conversations</h3>
                <input type="text" class="conv-search" id="convSearch" placeholder="Rechercher..." />
                <div id="convList"></div>
            </div>

            <div class="chat-window" id="chatWindow">
                <div class="no-chat-selected" id="noChatSelected">
                    <i class="fas fa-comments"></i>
                    <h3>Sélectionnez une conversation</h3>
                    <p>Ou commencez une nouvelle discussion depuis une carte.</p>
                </div>

                <div id="activeChat" style="display:none; flex-direction: column; height: 100%;">
                    <div class="chat-header">
                        <div class="conv-avatar" id="chatAvatar" style="cursor:pointer;" onclick="ouvrirFicheProfilChat()">?</div>
                        <div class="info" style="cursor:pointer;" onclick="ouvrirFicheProfilChat()">
                            <div class="name" id="chatName">—</div>
                            <div class="status" id="chatStatus">
                                <span class="dot"></span>
                                <span id="chatStatusText">—</span>
                            </div>
                        </div>
                        <div class="actions">
                            <button id="btnCallAudio" title="Appel audio">
                                <i class="fas fa-phone"></i>
                            </button>
                            <button id="btnCallVideo" title="Appel vidéo">
                                <i class="fas fa-video"></i>
                            </button>
                        </div>
                    </div>

                    <div class="chat-messages" id="chatMessages"></div>

                    <div class="chat-input">
                        <label for="fileInput" class="btn-attach-label" title="Joindre un fichier">
                            <i class="fas fa-paperclip"></i>
                        </label>
                        <input type="file" id="fileInput" style="display:none;" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv" />

                        <input type="text" id="msgInput" placeholder="Votre message..." />

                        <button id="btnRecord" class="btn-icon" title="Enregistrer un vocal">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button id="btnSend" class="btn-icon btn-send" title="Envoyer">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="recording-overlay" id="recordingOverlay">
        <i class="fas fa-microphone"></i>
        <p>Enregistrement en cours...</p>
        <div class="timer" id="recordTimer">0:00</div>
        <div class="actions">
            <button class="cancel" id="btnCancelRecord">Annuler</button>
            <button class="send" id="btnSendRecord">Envoyer</button>
        </div>
    </div>

    <!-- MODALE FICHE PROFIL -->
    <div class="profile-overlay" id="profileOverlay">
        <div class="profile-box" id="profileBox">
            <button class="close-btn" id="profileClose"><i class="fas fa-times"></i></button>
            <div id="profileContent"></div>
        </div>
    </div>

    <script src="js/supabase.js"></script>

    <script>
        let currentUser = null;
        let currentProfile = null;
        let currentConversationId = null;
        let currentOtherUser = null;
        let allConversations = [];
        let realtimeChannel = null;
        let typingChannel = null;
        let typingTimeout = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordInterval = null;
        let recordStartTime = 0;

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        function getOtherUserId(conv) {
            if (!conv || !currentUser) return null;
            if (conv.user1_id === currentUser.id) return conv.user2_id;
            if (conv.user2_id === currentUser.id) return conv.user1_id;
            return null;
        }

        async function getAuteur(userId) {
            const client = initialiserSupabase();
            if (!client || !userId) return { nom: '—', avatar_url: null };
            try {
                const { data, error } = await client.rpc('obtenir_auteur', { p_user_id: userId });
                if (!error && data && data[0]) {
                    return { nom: data[0].nom || '—', avatar_url: data[0].avatar_url || null };
                }
            } catch (e) {}
            return { nom: '—', avatar_url: null };
        }

        async function initialiser() {
            const client = initialiserSupabase();
            if (!client) return;

            const { data: { session } } = await client.auth.getSession();
            if (!session) {
                window.location.href = 'connexion.html';
                return;
            }
            currentUser = session.user;

            const { data: profileData } = await client
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();
            currentProfile = profileData;

            await chargerConversations();

            const params = new URLSearchParams(window.location.search);
            const convId = params.get('conv');
            const otherUser = params.get('user');
            const cardId = params.get('card');

            if (otherUser) {
                const { data, error } = await client.rpc('get_or_create_conversation', {
                    p_other_user_id: otherUser,
                    p_card_id: cardId || null
                });
                if (!error && data) {
                    await chargerConversations();
                    await ouvrirConversation(data);
                }
            } else if (convId) {
                await ouvrirConversation(convId);
            }
        }

        async function chargerConversations() {
            const client = initialiserSupabase();
            if (!client) return;

            const { data, error } = await client
                .from('conversations')
                .select('*')
                .or(`user1_id.eq.${currentUser.id},user2_id.eq.${currentUser.id}`)
                .order('updated_at', { ascending: false });

            if (error) {
                console.error('Erreur chargement conversations:', error);
                return;
            }

            allConversations = data || [];
            await afficherConversations();
        }

        async function afficherConversations() {
            const container = document.getElementById('convList');

            if (allConversations.length === 0) {
                container.innerHTML = `
                    <div class="conv-empty">
                        <i class="fas fa-comment-slash"></i>
                        <p>Aucune conversation</p>
                        <p style="font-size:12px;margin-top:6px;">Commencez une discussion depuis une carte</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            for (const conv of allConversations) {
                const otherId = getOtherUserId(conv);
                if (!otherId) continue;

                const auteur = await getAuteur(otherId);
                const initial = (auteur.nom || '?').charAt(0).toUpperCase();
                const avatarStyle = auteur.avatar_url ? `background-image:url('${auteur.avatar_url}');` : '';

                const item = document.createElement('div');
                item.className = 'conv-item';
                if (conv.id === currentConversationId) item.classList.add('active');
                item.dataset.convId = conv.id;
                item.innerHTML = `
                    <div class="conv-avatar" style="${avatarStyle}">${auteur.avatar_url ? '' : initial}</div>
                    <div class="conv-info">
                        <div class="conv-name">${escapeHTML(auteur.nom)}</div>
                        <div class="conv-last">${escapeHTML(conv.last_message || '...')}</div>
                    </div>
                `;
                item.addEventListener('click', () => ouvrirConversation(conv.id));
                container.appendChild(item);
            }
        }

        async function ouvrirConversation(convId) {
            const client = initialiserSupabase();
            if (!client) return;

            if (allConversations.length === 0) await chargerConversations();

            let conv = allConversations.find(c => c.id === convId);
            if (!conv) {
                await chargerConversations();
                conv = allConversations.find(c => c.id === convId);
            }
            if (!conv) {
                console.error('Conversation non trouvée:', convId);
                return;
            }

            currentConversationId = convId;

            const otherId = getOtherUserId(conv);
            if (!otherId) return;

            const auteur = await getAuteur(otherId);
            currentOtherUser = { id: otherId, ...auteur };

            const initial = (auteur.nom || '?').charAt(0).toUpperCase();
            const avatarStyle = auteur.avatar_url ? `background-image:url('${auteur.avatar_url}');` : '';
            const avatar = document.getElementById('chatAvatar');
            avatar.textContent = auteur.avatar_url ? '' : initial;
            avatar.style.backgroundImage = auteur.avatar_url ? `url('${auteur.avatar_url}')` : '';
            document.getElementById('chatName').textContent = auteur.nom || '—';

            document.getElementById('noChatSelected').style.display = 'none';
            document.getElementById('activeChat').style.display = 'flex';

            await chargerMessages();
            souscrireRealtime(convId);
            await afficherConversations();
            scrollChatBottom();
        }

        async function chargerMessages() {
            const client = initialiserSupabase();
            if (!client || !currentConversationId) return;

            const { data, error } = await client
                .from('messages')
                .select('*')
                .eq('conversation_id', currentConversationId)
                .order('created_at', { ascending: true });

            if (error) {
                console.error(error);
                return;
            }

            const container = document.getElementById('chatMessages');

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="chat-empty">
                        <i class="fas fa-comment-dots"></i>
                        <p>Commencez la discussion</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            data.forEach(msg => afficherMessage(msg));

            await client
                .from('messages')
                .update({ read: true })
                .eq('conversation_id', currentConversationId)
                .neq('sender_id', currentUser.id);

            scrollChatBottom();
        }

        function afficherMessage(msg) {
            const container = document.getElementById('chatMessages');
            const isMe = msg.sender_id === currentUser.id;

            const row = document.createElement('div');
            row.className = 'msg-row' + (isMe ? ' me' : '');

            let bubbleContent = '';

            if (msg.type === 'text') {
                bubbleContent = `<div class="msg-bubble">${escapeHTML(msg.content || '')}<div class="msg-time">${formatTime(msg.created_at)}</div></div>`;
            } else if (msg.type === 'audio') {
                bubbleContent = `<div class="msg-bubble audio">
                    <audio controls preload="metadata" src="${msg.media_url}"></audio>
                    <div class="msg-time">${formatTime(msg.created_at)}</div>
                </div>`;
            } else if (msg.type === 'image') {
                bubbleContent = `<div class="msg-bubble"><img src="${msg.media_url}" alt="" loading="lazy" /><div class="msg-time">${formatTime(msg.created_at)}</div></div>`;
            } else if (msg.type === 'video') {
                bubbleContent = `<div class="msg-bubble"><video controls preload="metadata" src="${msg.media_url}"></video><div class="msg-time">${formatTime(msg.created_at)}</div></div>`;
            } else if (msg.type === 'document') {
                bubbleContent = `<div class="msg-bubble">
                    <a href="${msg.media_url}" target="_blank" class="file-link">
                        <i class="fas fa-file-alt"></i>
                        <span>${escapeHTML(msg.content || 'Document')}</span>
                    </a>
                    <div class="msg-time">${formatTime(msg.created_at)}</div>
                </div>`;
            }

            row.innerHTML = bubbleContent;
            container.appendChild(row);
        }

        function scrollChatBottom() {
            const c = document.getElementById('chatMessages');
            if (c) c.scrollTop = c.scrollHeight;
        }

        document.getElementById('btnSend').addEventListener('click', envoyerMessageTexte);
        document.getElementById('msgInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                envoyerMessageTexte();
            }
        });

        document.getElementById('msgInput').addEventListener('input', function() {
            if (!currentConversationId) return;
            signalerTyping(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => signalerTyping(false), 2000);
        });

        async function signalerTyping(isTyping) {
            const client = initialiserSupabase();
            if (!client || !currentConversationId) return;

            if (isTyping) {
                await client.from('typing_indicators').upsert({
                    conversation_id: currentConversationId,
                    user_id: currentUser.id,
                    updated_at: new Date().toISOString()
                });
            } else {
                await client.from('typing_indicators')
                    .delete()
                    .eq('conversation_id', currentConversationId)
                    .eq('user_id', currentUser.id);
            }
        }

        async function envoyerMessageTexte() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content || !currentConversationId) return;

            const client = initialiserSupabase();
            if (!client) return;

            input.value = '';
            await signalerTyping(false);

            const { error } = await client.from('messages').insert([{
                conversation_id: currentConversationId,
                sender_id: currentUser.id,
                content: content,
                type: 'text'
            }]);

            if (error) {
                console.error(error);
                alert('Erreur d\'envoi');
            }
        }

        document.getElementById('fileInput').addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            const client = initialiserSupabase();
            if (!client || !currentConversationId) {
                this.value = '';
                return;
            }

            let type = 'document';
            if (file.type.startsWith('image/')) type = 'image';
            else if (file.type.startsWith('video/')) type = 'video';
            else if (file.type.startsWith('audio/')) type = 'audio';

            try {
                const ext = file.name.split('.').pop();
                const cleanName = file.name.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                const path = `${currentUser.id}/chat_${Date.now()}_${cleanName}.${ext}`;

                const { error: uploadError } = await client
                    .storage
                    .from('cards-media')
                    .upload(path, file, { cacheControl: '3600', upsert: false });

                if (uploadError) throw uploadError;

                const { data: urlData } = client
                    .storage
                    .from('cards-media')
                    .getPublicUrl(path);

                await client.from('messages').insert([{
                    conversation_id: currentConversationId,
                    sender_id: currentUser.id,
                    content: file.name,
                    type: type,
                    media_url: urlData.publicUrl
                }]);

            } catch (error) {
                console.error(error);
                alert('Erreur d\'upload : ' + error.message);
            }

            this.value = '';
        });

        document.getElementById('btnRecord').addEventListener('click', async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.start();
                ouvrirOverlayEnregistrement();
            } catch (error) {
                console.error(error);
                alert('Impossible d\'enregistrer');
            }
        });

        function ouvrirOverlayEnregistrement() {
            const overlay = document.getElementById('recordingOverlay');
            overlay.classList.add('show');
            recordStartTime = Date.now();
            document.getElementById('recordTimer').textContent = '0:00';

            recordInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
                const min = Math.floor(elapsed / 60);
                const sec = String(elapsed % 60).padStart(2, '0');
                document.getElementById('recordTimer').textContent = `${min}:${sec}`;
            }, 1000);
        }

        function fermerOverlayEnregistrement() {
            document.getElementById('recordingOverlay').classList.remove('show');
            clearInterval(recordInterval);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
        }

        document.getElementById('btnCancelRecord').addEventListener('click', function() {
            audioChunks = [];
            fermerOverlayEnregistrement();
        });

        document.getElementById('btnSendRecord').addEventListener('click', async function() {
            if (!mediaRecorder || audioChunks.length === 0) {
                fermerOverlayEnregistrement();
                return;
            }

            const finaliser = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                envoyerAudio(blob);
            };

            if (mediaRecorder.state === 'recording') {
                mediaRecorder.onstop = finaliser;
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            } else {
                finaliser();
            }

            fermerOverlayEnregistrement();
        });

        async function envoyerAudio(blob) {
            const client = initialiserSupabase();
            if (!client || !currentConversationId) return;

            try {
                const path = `${currentUser.id}/audio_${Date.now()}.webm`;
                const { error: uploadError } = await client
                    .storage
                    .from('cards-media')
                    .upload(path, blob, { contentType: 'audio/webm' });

                if (uploadError) throw uploadError;

                const { data: urlData } = client
                    .storage
                    .from('cards-media')
                    .getPublicUrl(path);

                await client.from('messages').insert([{
                    conversation_id: currentConversationId,
                    sender_id: currentUser.id,
                    content: '🎤 Message vocal',
                    type: 'audio',
                    media_url: urlData.publicUrl
                }]);

            } catch (error) {
                console.error(error);
            }
        }

        document.getElementById('btnCallAudio').addEventListener('click', function() {
            alert('📞 Bientôt disponible : Appel audio');
        });
        document.getElementById('btnCallVideo').addEventListener('click', function() {
            alert('🎥 Bientôt disponible : Appel vidéo');
        });

        function souscrireRealtime(convId) {
            const client = initialiserSupabase();
            if (!client) return;

            if (realtimeChannel) client.removeChannel(realtimeChannel);
            if (typingChannel) client.removeChannel(typingChannel);

            realtimeChannel = client
                .channel('messages_' + convId)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `conversation_id=eq.${convId}`
                }, async (payload) => {
                    afficherMessage(payload.new);
                    scrollChatBottom();

                    if (payload.new.sender_id !== currentUser.id) {
                        await client
                            .from('messages')
                            .update({ read: true })
                            .eq('id', payload.new.id);
                    }

                    await chargerConversations();
                })
                .subscribe();

            typingChannel = client
                .channel('typing_' + convId)
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'typing_indicators',
                    filter: `conversation_id=eq.${convId}`
                }, (payload) => {
                    const status = document.getElementById('chatStatus');
                    const txt = document.getElementById('chatStatusText');

                    if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                        if (payload.new.user_id !== currentUser.id) {
                            status.classList.add('typing');
                            txt.textContent = 'est en train d\'écrire...';
                        }
                    } else if (payload.eventType === 'DELETE') {
                        status.classList.remove('typing');
                        txt.textContent = 'En ligne';
                    }
                })
                .subscribe();
        }

        document.getElementById('convSearch').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('.conv-item').forEach(item => {
                const name = item.querySelector('.conv-name').textContent.toLowerCase();
                item.style.display = name.includes(q) ? 'flex' : 'none';
            });
        });

        // ============================================================
        // FICHE PROFIL
        // ============================================================
        const profileOverlay = document.getElementById('profileOverlay');
        const profileContent = document.getElementById('profileContent');
        const profileClose = document.getElementById('profileClose');

        profileClose.addEventListener('click', () => profileOverlay.classList.remove('show'));
        profileOverlay.addEventListener('click', (e) => {
            if (e.target === profileOverlay) profileOverlay.classList.remove('show');
        });

        async function ouvrirFicheProfilChat() {
            if (!currentOtherUser || !currentOtherUser.id) return;
            await afficherFicheProfil(currentOtherUser.id);
        }

        async function afficherFicheProfil(userId) {
            const client = initialiserSupabase();
            if (!client) return;

            profileContent.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin" style="font-size:32px;color:var(--rouge);"></i></div>';
            profileOverlay.classList.add('show');

            const { data: profilData, error: profilError } = await client.rpc('obtenir_profil_public', { p_user_id: userId });
            if (profilError || !profilData || !profilData[0]) {
                profileContent.innerHTML = '<div style="text-align:center;padding:40px;color:var(--rouge);">Profil introuvable</div>';
                return;
            }

            const profil = profilData[0];

            const { data: statutData } = await client.rpc('statut_amitie', { p_other_user_id: userId });
            const statut = statutData && statutData[0] ? statutData[0] : { status: null, direction: null, friendship_id: null };

            const initial = (profil.nom || '?').charAt(0).toUpperCase();
            const avatarStyle = profil.avatar_url ? `background-image:url('${profil.avatar_url}');` : '';
            const dateInscription = new Date(profil.created_at).toLocaleDateString('fr-FR', {
                day: '2-digit', month: 'long', year: 'numeric'
            });

            const estMoi = currentUser && currentUser.id === userId;

            let html = `
                <div class="big-avatar" style="${avatarStyle}">${profil.avatar_url ? '' : initial}</div>
                <h2>${escapeHTML(profil.nom || '—')}</h2>
                <p class="subtitle">${escapeHTML(profil.domaine || '—')}</p>
            `;

            if (statut.status === 'accepted') {
                html += `<span class="friend-badge accepted"><i class="fas fa-user-check"></i> Ami</span>`;
            } else if (statut.status === 'pending' && statut.direction === 'sent') {
                html += `<span class="friend-badge pending-sent"><i class="fas fa-clock"></i> Demande envoyée</span>`;
            } else if (statut.status === 'pending' && statut.direction === 'received') {
                html += `<span class="friend-badge pending-received"><i class="fas fa-user-plus"></i> Demande reçue</span>`;
            }

            html += `<div class="profile-info-list">`;

            if (profil.sexe) {
                html += `<div class="profile-info-row">
                    <span class="label"><i class="fas fa-venus-mars"></i> Sexe</span>
                    <span class="value">${escapeHTML(profil.sexe)}</span>
                </div>`;
            }
            if (profil.age) {
                html += `<div class="profile-info-row">
                    <span class="label"><i class="fas fa-birthday-cake"></i> Âge</span>
                    <span class="value">${profil.age} ans</span>
                </div>`;
            }
            if (profil.pays) {
                html += `<div class="profile-info-row">
                    <span class="label"><i class="fas fa-globe-africa"></i> Pays</span>
                    <span class="value">${escapeHTML(profil.pays)}</span>
                </div>`;
            }
            if (profil.domaine) {
                html += `<div class="profile-info-row">
                    <span class="label"><i class="fas fa-briefcase"></i> Domaine</span>
                    <span class="value">${escapeHTML(profil.domaine)}</span>
                </div>`;
            }
            if (profil.email) {
                html += `<div class="profile-info-row">
                    <span class="label"><i class="fas fa-envelope"></i> Email</span>
                    <span class="value"><a href="mailto:${profil.email}">${escapeHTML(profil.email)}</a></span>
                </div>`;
            }
            if (profil.telephone) {
                const telClean = profil.telephone.replace(/[^0-9+]/g, '');
                html += `<div class="profile-info-row">
                    <span class="label"><i class="fas fa-phone"></i> Téléphone</span>
                    <span class="value"><a href="tel:${telClean}">${escapeHTML(profil.telephone)}</a></span>
                </div>`;
            }
            html += `<div class="profile-info-row">
                <span class="label"><i class="fas fa-calendar"></i> Inscription</span>
                <span class="value">${dateInscription}</span>
            </div>`;
            html += `</div>`;

            html += `<div class="profile-actions">`;

            if (estMoi) {
                html += `<button class="btn-message-friend" onclick="window.location.href='profil.html'">
                    <i class="fas fa-user-edit"></i> Mon profil
                </button>`;
            } else {
                if (!statut.status) {
                    html += `<button class="btn-add-friend" onclick="envoyerDemandeAmi('${userId}')">
                        <i class="fas fa-user-plus"></i> Ajouter en ami
                    </button>`;
                } else if (statut.status === 'pending' && statut.direction === 'received') {
                    html += `<button class="btn-accept-friend" onclick="repondreAmi('${statut.friendship_id}', true)">
                        <i class="fas fa-check"></i> Accepter
                    </button>`;
                    html += `<button class="btn-reject-friend" onclick="repondreAmi('${statut.friendship_id}', false)">
                        <i class="fas fa-times"></i> Refuser
                    </button>`;
                } else if (statut.status === 'pending' && statut.direction === 'sent') {
                    html += `<button class="btn-remove-friend" onclick="supprimerAmi('${statut.friendship_id}')">
                        <i class="fas fa-clock"></i> Annuler
                    </button>`;
                } else if (statut.status === 'accepted') {
                    html += `<button class="btn-remove-friend" onclick="supprimerAmi('${statut.friendship_id}')">
                        <i class="fas fa-user-minus"></i> Retirer
                    </button>`;
                }

                html += `<button class="btn-message-friend" onclick="profileOverlay.classList.remove('show')">
                    <i class="fas fa-comments"></i> Message
                </button>`;
            }

            html += `</div>`;
            profileContent.innerHTML = html;
        }

        async function envoyerDemandeAmi(userId) {
            const client = initialiserSupabase();
            if (!client) return;

            const { data, error } = await client.rpc('ajouter_ami', { p_friend_id: userId });
            if (error || !data) {
                alert('Erreur : impossible d\'envoyer la demande');
                return;
            }

            await afficherFicheProfil(userId);
        }

        async function repondreAmi(friendshipId, accept) {
            const client = initialiserSupabase();
            if (!client) return;

            const { data, error } = await client.rpc('repondre_demande_ami', {
                p_friendship_id: friendshipId,
                p_accept: accept
            });

            if (error || !data) {
                alert('Erreur : action impossible');
                return;
            }

            await afficherFicheProfil(currentOtherUser.id);
        }

        async function supprimerAmi(friendshipId) {
            if (!confirm('Confirmer ?')) return;

            const client = initialiserSupabase();
            if (!client) return;

            const { data, error } = await client.rpc('supprimer_ami', { p_friendship_id: friendshipId });
            if (error || !data) {
                alert('Erreur : action impossible');
                return;
            }

            await afficherFicheProfil(currentOtherUser.id);
        }

        // ============================================================
        // LANCEMENT
        // ============================================================
        initialiser().catch(err => console.error('Erreur messagerie :', err));
    </script>

</body>
</html>
