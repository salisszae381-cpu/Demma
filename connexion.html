<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Demma · Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif; background: #f0f2f5;
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; padding: 24px;
        }
        .login-container {
            max-width: 460px; width: 100%; background: #ffffff;
            border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.10);
            padding: 44px 40px 36px;
        }
        .top-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .lang-dropdown { position: relative; display: inline-block; }
        .lang-btn {
            background: #ffffff; border: 1px solid #dce3ec;
            border-radius: 40px; padding: 8px 18px;
            font-size: 14px; font-weight: 500; color: #1a2f4a;
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .lang-btn:hover { border-color: #a0b4c8; background: #f8faff; }
        .lang-dropdown-content {
            display: none; position: absolute; top: 110%; right: 0;
            background: #ffffff; min-width: 180px;
            border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.15);
            border: 1px solid #e4e9f0; z-index: 999; padding: 6px 0;
        }
        .lang-dropdown-content.show { display: block; }
        .lang-item {
            padding: 10px 18px; font-size: 14px;
            cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
        }
        .lang-item:hover { background: #f5f8ff; }
        .lang-item .check { color: #c0392b; font-weight: 700; }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header .logo {
            display: inline-flex; align-items: center; gap: 10px;
            font-size: 28px; font-weight: 700; color: #0a1628; margin-bottom: 6px;
        }
        .login-header .logo i {
            color: #c0392b; background: #f0e8e0;
            padding: 10px; border-radius: 14px; font-size: 26px;
        }
        .login-header .logo span { color: #c0392b; }
        .login-header p { color: #5a6e85; font-size: 15px; }
        .login-header p a { color: #c0392b; font-weight: 600; text-decoration: none; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-weight: 600; font-size: 14px;
            color: #0a1628; margin-bottom: 5px;
        }
        .form-group input {
            width: 100%; padding: 14px 18px; border: 1.5px solid #dce3ec;
            border-radius: 16px; font-size: 15px;
            font-family: "Inter", sans-serif; background: #fafcff;
            transition: 0.2s; color: #0a1628;
        }
        .form-group input:focus {
            outline: none; border-color: #c0392b;
            box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.08); background: #ffffff;
        }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 50px; }
        .password-wrapper .toggle-pwd {
            position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            color: #5a6e85; font-size: 18px; cursor: pointer; padding: 4px;
        }
        .btn-login {
            width: 100%; padding: 16px; background: #0a1628; border: none;
            border-radius: 60px; font-size: 17px; font-weight: 700;
            color: #ffffff; cursor: pointer; transition: 0.25s;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 18px;
        }
        .btn-login:hover { background: #1a2f4a; transform: scale(1.01); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .divider {
            display: flex; align-items: center; gap: 16px;
            color: #a0b4c8; font-size: 13px; margin: 12px 0 18px;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: #dce3ec;
        }
        .btn-register {
            width: 100%; padding: 14px; background: transparent;
            border: 1.5px solid #dce3ec; border-radius: 60px;
            font-size: 15px; font-weight: 600; color: #0a1628;
            cursor: pointer; transition: 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none;
        }
        .btn-register:hover { background: #f5f8ff; border-color: #aab8cc; }
        .btn-register i { color: #c0392b; }
        .form-error { color: #c0392b; font-size: 13px; margin-top: 4px; display: none; }
        .form-error.show { display: block; }
        .info-box {
            background: #e3f2fd; color: #0d47a1; padding: 12px 18px;
            border-radius: 14px; margin-bottom: 20px; font-size: 13px;
            border: 1px solid #90caf9;
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="top-row">
            <div id="langSelector"></div>
        </div>

        <div class="login-header">
            <div class="logo">
                <i class="fas fa-arrows-retweet"></i>
                <h1>Demma<span>.</span></h1>
            </div>
            <p>
                <span data-i18n="log_title">Connectez-vous à votre compte</span>
                <br />
                <small>
                    <span data-i18n="log_no_account">Pas encore membre ?</span>
                    <a href="inscription.html" data-i18n="log_create_link">Créer un compte</a>
                </small>
            </p>
        </div>

        <div class="info-box">
            <strong data-i18n="reg_info">Mode test : utilisez le numéro +229 90 00 00 00 et le code 123456.</strong>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label data-i18n="field_phone">Numéro de téléphone</label>
                <input type="tel" id="loginPhone" placeholder="+229 90 00 00 00" required />
                <div class="form-error" id="phoneError" data-i18n="err_phone">Veuillez entrer un numéro valide.</div>
            </div>

            <div class="form-group">
                <label data-i18n="field_password">Mot de passe</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Votre mot de passe" required />
                    <button type="button" class="toggle-pwd" id="togglePwd">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="form-error" id="pwdError" data-i18n="err_pwd">Le mot de passe doit contenir au moins 6 caractères.</div>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> <span data-i18n="btn_login">Se connecter</span>
            </button>

            <div class="divider" data-i18n="log_or">ou</div>

            <a href="inscription.html" class="btn-register">
                <i class="fas fa-user-plus"></i> <span data-i18n="log_create_btn">Créer un compte Demma</span>
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script>
        renderLanguageSelector('langSelector');

        const pwdInput = document.getElementById('loginPassword');
        document.getElementById('togglePwd').addEventListener('click', function() {
            const isPwd = pwdInput.type === 'password';
            pwdInput.type = isPwd ? 'text' : 'password';
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        const form = document.getElementById('loginForm');
        const phoneError = document.getElementById('phoneError');
        const pwdError = document.getElementById('pwdError');
        const submitBtn = document.getElementById('submitBtn');

        function normalizePhone(phone) {
            return phone.replace(/[\s\-\(\)\+]/g, '');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            phoneError.classList.remove('show');
            pwdError.classList.remove('show');

            const phoneVal = document.getElementById('loginPhone').value.trim();
            const pwd = pwdInput.value.trim();
            let isValid = true;

            if (phoneVal.length < 8) { phoneError.classList.add('show'); isValid = false; }
            if (pwd.length < 6) { pwdError.classList.add('show'); isValid = false; }
            if (!isValid) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const phone = normalizePhone(phoneVal);
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    phone: '+' + phone,
                    password: pwd
                });
                if (error) throw error;

                alert('✅ ' + t('success_login'));
                window.location.href = 'profil.html';

            } catch (error) {
                console.error(error);
                alert('❌ ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>' + t('btn_login') + '</span>';
            }
        });
    </script>
</body>
</html>
