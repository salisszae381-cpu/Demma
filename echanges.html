<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demma · Échanges</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  .echanges-wrap { max-width: 1400px; margin: 0 auto; padding: 20px; }

  .echanges-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .echanges-head h2 { font-size: 26px; font-weight: 800; color: var(--noir); }
  .echanges-head p { color: var(--gris-texte); font-size: 14px; margin-top: 4px; }

  .lang-switch {
    display: flex; background: #fff; border-radius: 30px;
    padding: 4px; gap: 2px; border: 1px solid #e8eef6;
  }
  .lang-switch button {
    background: transparent; border: none; padding: 8px 14px;
    border-radius: 24px; cursor: pointer; color: var(--gris-texte);
    font-weight: 700; font-size: 13px; font-family: inherit;
    transition: 0.15s;
  }
  .lang-switch button.active { background: var(--noir); color: #fff; }

  .search-bar {
    position: sticky; top: 10px; z-index: 20;
    background: rgba(240, 242, 245, 0.9);
    backdrop-filter: blur(8px);
    padding: 12px 0; margin-bottom: 20px;
  }
  .search-bar .inner { position: relative; max-width: 700px; margin: 0 auto; }
  .search-bar input {
    width: 100%; padding: 14px 18px 14px 48px;
    border: 1.5px solid #e8eef6; border-radius: 30px;
    background: #fff; color: var(--noir); font-size: 15px;
    font-family: inherit; outline: none; transition: 0.2s;
  }
  .search-bar input:focus { border-color: var(--rouge); }
  .search-bar svg {
    position: absolute; inset-inline-start: 18px; top: 50%;
    transform: translateY(-50%); color: var(--gris-texte);
    width: 18px; height: 18px;
  }
  body.rtl .search-bar input { padding: 14px 48px 14px 18px; }

  .members-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .member-card {
    background: #fff; border: 1px solid #e8eef6; border-radius: 24px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
  }
  .member-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  }
  .member-head {
    height: 100px;
    background: linear-gradient(135deg, #0a1628, #2a4060, #a03020);
    position: relative;
  }
  .member-avatar {
    position: absolute; inset-inline-start: 20px; bottom: -36px;
    width: 78px; height: 78px; border-radius: 20px;
    object-fit: cover; background: var(--noir);
    border: 4px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 30px;
    background-size: cover; background-position: center;
  }
  .member-body { padding: 46px 20px 20px; display: flex; flex-direction: column; flex: 1; }
  .member-name {
    font-size: 17px; font-weight: 800; color: var(--noir);
    margin-bottom: 6px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .member-domain {
    display: inline-block; font-size: 12px; font-weight: 700;
    color: var(--rouge); background: rgba(160, 48, 32, 0.08);
    padding: 4px 12px; border-radius: 30px;
    margin-bottom: 10px; align-self: flex-start;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .member-meta {
    font-size: 13px; color: var(--gris-texte);
    margin-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap;
  }
  .member-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .member-meta i { color: var(--rouge); font-size: 11px; }
  .member-since {
    font-size: 12px; color: var(--gris-texte);
    margin: 10px 0 14px; display: flex; align-items: center; gap: 6px;
  }
  .member-since i { color: var(--rouge); }
  .member-actions { display: flex; gap: 8px; margin-top: auto; }
  .btn-discuss {
    flex: 1; background: var(--noir); color: #fff; border: none;
    padding: 11px 14px; border-radius: 30px;
    font-weight: 700; font-size: 14px; cursor: pointer;
    font-family: inherit; transition: 0.15s;
    display: inline-flex; align-items: center;
    justify-content: center; gap: 8px;
  }
  .btn-discuss:hover { background: var(--rouge); }
  .btn-profile-mini {
    background: #f0f4fc; border: none; color: var(--noir);
    padding: 11px 14px; border-radius: 30px; cursor: pointer;
    font-family: inherit; transition: 0.15s;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px;
  }
  .btn-profile-mini:hover { background: var(--noir); color: #fff; }
  .guest-note {
    font-size: 11px; color: #8b5a00; text-align: center;
    margin-top: 10px; background: #fff4e0;
    padding: 6px 10px; border-radius: 12px;
  }

  .state-msg {
    text-align: center; padding: 60px 20px;
    color: var(--gris-texte); font-size: 15px;
    grid-column: 1 / -1;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid #e8eef6;
    border-top-color: var(--rouge); border-radius: 50%;
    margin: 0 auto 12px; animation: sp 0.8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* === MODALE PROFIL (lecture seule, accessible à TOUT LE MONDE) === */
  .profil-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(10, 22, 40, 0.7); z-index: 3000;
    align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto;
  }
  .profil-overlay.show { display: flex; }
  .profil-box {
    background: #fff; border-radius: 32px;
    padding: 32px 28px; max-width: 500px; width: 100%;
    position: relative; text-align: center;
    max-height: 90vh; overflow-y: auto;
  }
  .profil-box .close-btn {
    position: absolute; top: 16px; right: 16px;
    background: #f5f0f0; border: none;
    width: 40px; height: 40px; border-radius: 50%;
    font-size: 18px; color: var(--rouge);
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .profil-box .big-avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: var(--noir); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700; margin: 0 auto 16px;
    background-size: cover; background-position: center;
    border: 4px solid #f0f2f5;
  }
  .profil-box h2 {
    font-size: 22px; font-weight: 700;
    color: var(--noir); margin-bottom: 4px;
  }
  .profil-box .subtitle {
    color: var(--gris-texte); font-size: 14px; margin-bottom: 24px;
  }
  .profil-info-list {
    text-align: left; background: #fafdff;
    border-radius: 16px; padding: 16px 20px;
    margin-bottom: 16px; border: 1px solid #e8eef6;
  }
  .profil-info-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #eef3f9; font-size: 14px;
  }
  .profil-info-row:last-child { border-bottom: none; }
  .profil-info-row .label {
    color: var(--gris-texte); font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .profil-info-row .label i { color: var(--rouge); width: 18px; }
  .profil-info-row .value {
    color: var(--noir); font-weight: 600;
    text-align: right; max-width: 60%; word-break: break-word;
  }
  .profil-actions {
    display: flex; gap: 10px; margin-top: 20px;
  }
  .profil-actions button {
    flex: 1; padding: 14px 20px; border-radius: 60px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; border: none;
    display: inline-flex; align-items: center;
    justify-content: center; gap: 8px;
    background: var(--noir); color: #fff;
    transition: 0.15s;
  }
  .profil-actions button:hover { background: var(--rouge); }

  body.rtl { direction: rtl; }

  @media (max-width: 640px) {
    .members-grid { grid-template-columns: 1fr; }
    .echanges-head h2 { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <nav class="navbar">

      <a href="index.html"><h1>Demma<span>.</span></h1></a>
    </div>
    <div class="nav-right">

        <i class="fas fa-newspaper"></i>
        <span id="t-navFil">Fil d'actualité</span>
      </a>
      <a href="amis.html" class="btn-outline nav-protected">

      </a>
      <a href="profil.html" class="btn-outline nav-protected">

  <div class="echanges-wrap">

</div>

<!-- MODALE PROFIL (accessible à tout le monde) -->
<div class="profil-overlay" id="profilOverlay">
  <div class="profil-box">
    <button class="close-btn" id="profilClose"><i class="fas fa-times"></i></button>
    <div id="profilContent"></div>
  </div>
</div>

<script src="js/supabase.js"></script>

<script>
/* =============================================================
   TRADUCTIONS
   ============================================================= */
const I18N = {
  fr: {
    title: "Échanges entre membres",
    subtitle: "Discutez, partagez et collaborez avec la communauté Demma",
    search: "Rechercher un membre...",
    loading: "Chargement des membres...",
    empty: "Aucun membre trouvé",
    discuss: "Discuter",
    profile: "Voir le profil",
    since: "Membre depuis",
    guest: "Créez un compte pour participer aux échanges",
    years: "ans",
    navFil: "Fil d'actualité",
    navAmis: "Amis",
    navProfil: "Mon profil",
    sexe: "Sexe", age: "Âge", pays: "Pays", domaine: "Domaine", inscription: "Inscription",
    profilIntrouvable: "Profil introuvable",
    discuterAvec: "Discuter avec ce membre"
  },
  en: {
    title: "Member exchanges",
    subtitle: "Chat, share and collaborate with the Demma community",
    search: "Search a member...",
    loading: "Loading members...",
    empty: "No member found",
    discuss: "Chat",
    profile: "View profile",
    since: "Member since",
    guest: "Create an account to join exchanges",
    years: "yrs",
    navFil: "News feed",
    navAmis: "Friends",
    navProfil: "My profile",
    sexe: "Gender", age: "Age", pays: "Country", domaine: "Domain", inscription: "Joined",
    profilIntrouvable: "Profile not found",
    discuterAvec: "Chat with this member"
  },
  ar: {
    title: "التبادلات بين الأعضاء",
    subtitle: "تحدث وشارك وتعاون مع مجتمع دمة",
    search: "ابحث عن عضو...",
    loading: "جارٍ تحميل الأعضاء...",
    empty: "لم يتم العثور على أي عضو",
    discuss: "محادثة",
    profile: "عرض الملف",
    since: "عضو منذ",
    guest: "أنشئ حسابًا للمشاركة في التبادلات",
    years: "سنة",
    navFil: "آخر الأخبار",
    navAmis: "الأصدقاء",
    navProfil: "ملفي",
    sexe: "الجنس", age: "العمر", pays: "البلد", domaine: "المجال", inscription: "التسجيل",
    profilIntrouvable: "الملف غير موجود",
    discuterAvec: "محادثة مع هذا العضو"
  }
};

let LANG = localStorage.getItem('demma_lang') || 'fr';
const t = k => I18N[LANG][k] || k;

function appliquerLangue() {
  document.getElementById('htmlRoot').lang = LANG;
  document.body.classList.toggle('rtl', LANG === 'ar');
  document.getElementById('t-title').textContent      = t('title');
  document.getElementById('t-subtitle').textContent   = t('subtitle');
  document.getElementById('t-loading').textContent    = t('loading');
  document.getElementById('t-navFil').textContent     = t('navFil');
  document.getElementById('t-navAmis').textContent    = t('navAmis');
  document.getElementById('t-navProfil').textContent  = t('navProfil');
  document.getElementById('searchInput').placeholder  = t('search');
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
  renderMembers();
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => {
    LANG = b.dataset.lang;
    localStorage.setItem('demma_lang', LANG);
    appliquerLangue();
  });
});

/* =============================================================
   ÉTAT
   ============================================================= */
let CURRENT_USER = null;
let ALL_MEMBERS  = [];
let FILTER       = "";
let realtimeCh   = null;

/* =============================================================
   HELPERS
   ============================================================= */
function escapeHTML(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* =============================================================
   AUTH
   ============================================================= */
async function chargerUtilisateur() {
  try {
    const client = initialiserSupabase();
    if (!client) return;
    const { data: { session } } = await client.auth.getSession();
    CURRENT_USER = session ? session.user : null;
  } catch (e) {
    CURRENT_USER = null;
  }
}

/* =============================================================
   MEMBRES (lecture via profiles_public → accessible à tous)
   ============================================================= */
async function chargerMembres() {
  const client = initialiserSupabase();
  if (!client) return;

  const { data, error } = await client
    .from('profiles_public')
    .select('id, nom, avatar_url, domaine, sexe, age, pays, created_at')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Erreur chargement membres :', error);
    document.getElementById('membersGrid').innerHTML =
      '<div class="state-msg">' + t('empty') + '</div>';
    return;
  }

  ALL_MEMBERS = (data || []).filter(m => !CURRENT_USER || m.id !== CURRENT_USER.id);
  renderMembers();
}

function abonnerTempsReel() {
  const client = initialiserSupabase();
  if (!client) return;

  if (realtimeCh) client.removeChannel(realtimeCh);

  // Temps réel sur profiles_public (les vues exposent le même canal)
  realtimeCh = client
    .channel('profiles-echanges')
    .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'profiles_public' },
        payload => {
          if (CURRENT_USER && payload.new.id === CURRENT_USER.id) return;
          ALL_MEMBERS.unshift(payload.new);
          renderMembers();
        })
    .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'profiles_public' },
        payload => {
          const i = ALL_MEMBERS.findIndex(m => m.id === payload.new.id);
          if (i !== -1) ALL_MEMBERS[i] = { ...ALL_MEMBERS[i], ...payload.new };
          renderMembers();
        })
    .subscribe();
}

/* =============================================================
   FILTRE + RENDU
   ============================================================= */
function filtrer() {
  const q = FILTER.trim().toLowerCase();
  if (!q) return ALL_MEMBERS;
  return ALL_MEMBERS.filter(m =>
    (m.nom     || '').toLowerCase().includes(q) ||
    (m.domaine || '').toLowerCase().includes(q) ||
    (m.pays    || '').toLowerCase().includes(q)
  );
}

function renderMembers() {
  const grid = document.getElementById('membersGrid');
  const liste = filtrer();

  if (liste.length === 0) {
    grid.innerHTML = '<div class="state-msg"><i class="fas fa-user-slash" style="font-size:40px;color:#c5d2e0;display:block;margin-bottom:12px;"></i>' + t('empty') + '</div>';
    return;
  }

  const dateLocale = LANG === 'ar' ? 'ar-MA' : LANG === 'en' ? 'en-US' : 'fr-FR';

  grid.innerHTML = liste.map(m => {
    const initial = (m.nom || '?').charAt(0).toUpperCase();
    const avatarStyle = m.avatar_url ? "background-image:url('" + m.avatar_url + "');" : '';
    const since = m.created_at
      ? new Date(m.created_at).toLocaleDateString(dateLocale, { year: 'numeric', month: 'long' })
      : '—';

    const metaParts = [];
    if (m.age)  metaParts.push('<span><i class="fas fa-birthday-cake"></i> ' + m.age + ' ' + t('years') + '</span>');
    if (m.sexe) metaParts.push('<span><i class="fas fa-venus-mars"></i> ' + escapeHTML(m.sexe) + '</span>');
    if (m.pays) metaParts.push('<span><i class="fas fa-globe-africa"></i> ' + escapeHTML(m.pays) + '</span>');

    return [
      '<article class="member-card">',
        '<div class="member-head">',
          '<div class="member-avatar" style="' + avatarStyle + '">' + (m.avatar_url ? '' : initial) + '</div>',
        '</div>',
        '<div class="member-body">',
          '<h3 class="member-name" title="' + escapeHTML(m.nom) + '">' + escapeHTML(m.nom || '—') + '</h3>',
          m.domaine ? '<span class="member-domain">' + escapeHTML(m.domaine) + '</span>' : '',
          metaParts.length ? '<div class="member-meta">' + metaParts.join('') + '</div>' : '',
          '<p class="member-since"><i class="fas fa-calendar"></i> ' + t('since') + ' ' + since + '</p>',
          '<div class="member-actions">',
            '<button class="btn-discuss" data-action="discuss" data-id="' + m.id + '">',
              '<i class="fas fa-comments"></i> ' + t('discuss'),
            '</button>',
            '<button class="btn-profile-mini" data-action="profile" data-id="' + m.id + '" title="' + t('profile') + '">',
              '<i class="fas fa-user"></i>',
            '</button>',
          '</div>',
          !CURRENT_USER ? '<p class="guest-note"><i class="fas fa-info-circle"></i> ' + t('guest') + '</p>' : '',
        '</div>',
      '</article>'
    ].join('');
  }).join('');

  grid.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id     = btn.dataset.id;
      const action = btn.dataset.action;

      if (action === 'discuss') {
        if (!CURRENT_USER) {
          window.location.href = 'connexion.html?redirect=echanges.html';
          return;
        }
        window.location.href = 'messagerie.html?user=' + encodeURIComponent(id);
      } else {
        ouvrirFicheProfil(id);
      }
    });
  });
}

/* =============================================================
   FICHE PROFIL (lecture via profiles_public, accessible à tous)
   ============================================================= */
async function ouvrirFicheProfil(userId) {
  const overlay = document.getElementById('profilOverlay');
  const content = document.getElementById('profilContent');
  const client  = initialiserSupabase();

  content.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin" style="font-size:32px;color:var(--rouge);"></i></div>';
  overlay.classList.add('show');

  const { data, error } = await client
    .from('profiles_public')
    .select('id, nom, avatar_url, domaine, sexe, age, pays, created_at')
    .eq('id', userId)
    .single();

  if (error || !data) {
    content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--rouge);">' + t('profilIntrouvable') + '</div>';
    return;
  }

  const p = data;
  const initial = (p.nom || '?').charAt(0).toUpperCase();
  const avatarStyle = p.avatar_url ? "background-image:url('" + p.avatar_url + "');" : '';
  const dateLocale = LANG === 'ar' ? 'ar-MA' : LANG === 'en' ? 'en-US' : 'fr-FR';
  const dateInscription = p.created_at
    ? new Date(p.created_at).toLocaleDateString(dateLocale, { day: '2-digit', month: 'long', year: 'numeric' })
    : '—';

  let html = '<div class="big-avatar" style="' + avatarStyle + '">' + (p.avatar_url ? '' : initial) + '</div>';
  html += '<h2>' + escapeHTML(p.nom || '—') + '</h2>';
  html += '<p class="subtitle">' + escapeHTML(p.domaine || '—') + '</p>';

  html += '<div class="profil-info-list">';
  if (p.sexe)    html += '<div class="profil-info-row"><span class="label"><i class="fas fa-venus-mars"></i> ' + t('sexe') + '</span><span class="value">' + escapeHTML(p.sexe) + '</span></div>';
  if (p.age)     html += '<div class="profil-info-row"><span class="label"><i class="fas fa-birthday-cake"></i> ' + t('age') + '</span><span class="value">' + p.age + ' ' + t('years') + '</span></div>';
  if (p.pays)    html += '<div class="profil-info-row"><span class="label"><i class="fas fa-globe-africa"></i> ' + t('pays') + '</span><span class="value">' + escapeHTML(p.pays) + '</span></div>';
  if (p.domaine) html += '<div class="profil-info-row"><span class="label"><i class="fas fa-briefcase"></i> ' + t('domaine') + '</span><span class="value">' + escapeHTML(p.domaine) + '</span></div>';
  html += '<div class="profil-info-row"><span class="label"><i class="fas fa-calendar"></i> ' + t('inscription') + '</span><span class="value">' + dateInscription + '</span></div>';
  html += '</div>';

  html += '<div class="profil-actions">';
  html += '<button id="btnDiscuterDepuisProfil"><i class="fas fa-comments"></i> ' + t('discuterAvec') + '</button>';
  html += '</div>';

  content.innerHTML = html;

  document.getElementById('btnDiscuterDepuisProfil').addEventListener('click', () => {
    if (!CURRENT_USER) {
      window.location.href = 'connexion.html?redirect=echanges.html';
      return;
    }
    window.location.href = 'messagerie.html?user=' + encodeURIComponent(p.id);
  });
}

/* Fermeture modale */
document.getElementById('profilClose').addEventListener('click', () => {
  document.getElementById('profilOverlay').classList.remove('show');
});
document.getElementById('profilOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('profilOverlay')) {
    document.getElementById('profilOverlay').classList.remove('show');
  }
});

/* =============================================================
   NAVBAR — rediriger les visiteurs non connectés
   ============================================================= */
function protegerNavbar() {
  document.querySelectorAll('.nav-protected').forEach(lien => {
    lien.addEventListener('click', e => {
      if (!CURRENT_USER) {
        e.preventDefault();
        window.location.href = 'connexion.html?redirect=echanges.html';
      }
    });
  });
}

/* =============================================================
   RECHERCHE
   ============================================================= */
document.getElementById('searchInput').addEventListener('input', e => {
  FILTER = e.target.value;
  renderMembers();
});

/* =============================================================
   INIT
   ============================================================= */
(async function init() {
  appliquerLangue();
  await chargerUtilisateur();
  protegerNavbar();
  await chargerMembres();
  abonnerTempsReel();
})();
</script>

</body>
