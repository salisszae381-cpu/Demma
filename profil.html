<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Demma · Mon profil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif; background: #f0f2f5;
            min-height: 100vh; padding: 24px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; background: #ffffff;
            padding: 18px 24px; border-radius: 30px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            flex-wrap: wrap; gap: 12px;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; }
        .logo i {
            color: #c0392b; background: #f0e8e0;
            padding: 8px; border-radius: 12px; font-size: 20px;
        }
        .logo span { color: #c0392b; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logout-btn {
            background: #f5f0f0; border: none; color: #c0392b;
            padding: 10px 20px; border-radius: 40px; font-weight: 600;
            cursor: pointer; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .logout-btn:hover { background: #ead5d5; }

        .lang-dropdown { position: relative; display: inline-block; }
        .lang-btn {
            background: #ffffff; border: 1px solid #dce3ec;
            border-radius: 40px; padding: 8px 18px;
            font-size: 14px; font-weight: 500; color: #1a2f4a;
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .lang-btn:hover { border-color: #a0b4c8; background: #f8faff; }
        .lang-dropdown-content {
            display: none; position: absolute; top: 110%; right: 0;
            background: #ffffff; min-width: 180px;
            border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.15);
            border: 1px solid #e4e9f0; z-index: 999; padding: 6px 0;
        }
        .lang-dropdown-content.show { display: block; }
        .lang-item {
            padding: 10px 18px; font-size: 14px;
            cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
        }
        .lang-item:hover { background: #f5f8ff; }
        .lang-item .check { color: #c0392b; font-weight: 700; }

        .card {
            background: #ffffff; border-radius: 32px;
            padding: 32px 28px; margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        .card h2 {
            font-size: 20px; color: #0a1628; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .card h2 i { color: #c0392b; }

        .avatar-section { text-align: center; margin-bottom: 24px; }
        .avatar-wrapper { position: relative; display: inline-block; margin-bottom: 12px; }
        .avatar-img {
            width: 120px; height: 120px; border-radius: 60px;
            object-fit: cover; border: 4px solid #f0f2f5;
            background: #0a1628; display: block;
        }
        .avatar-initials {
            width: 120px; height: 120px; border-radius: 60px;
            background: #0a1628; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; font-weight: 700;
            border: 4px solid #f0f2f5;
        }
        .avatar-upload-btn {
            position: absolute; bottom: 4px; right: 4px;
            background: #c0392b; color: #fff;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 3px solid #ffffff;
            transition: 0.2s; font-size: 14px;
        }
        .avatar-upload-btn:hover { background: #a03020; transform: scale(1.05); }
        .avatar-upload-btn input[type="file"] { display: none; }

        .user-name {
            text-align: center; font-size: 22px; font-weight: 700;
            color: #0a1628; margin-bottom: 6px;
        }
        .user-sub {
            text-align: center; color: #5a6e85; font-size: 14px;
            margin-bottom: 24px;
        }
        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid #f0f2f5;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #5a6e85; font-size: 14px; font-weight: 500; }
        .info-value { color: #0a1628; font-size: 15px; font-weight: 600; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-weight: 600; font-size: 14px;
            color: #0a1628; margin-bottom: 5px;
        }
        .form-group input {
            width: 100%; padding: 14px 18px; border: 1.5px solid #dce3ec;
            border-radius: 16px; font-size: 15px; background: #fafcff;
            transition: 0.2s; color: #0a1628;
        }
        .form-group input:focus {
            outline: none; border-color: #c0392b;
            box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.08); background: #fff;
        }
        .btn-save {
            background: #0a1628; color: #fff; border: none;
            padding: 14px 28px; border-radius: 40px; font-weight: 600;
            font-size: 15px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-save:hover { background: #1a2f4a; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg {
            padding: 12px 18px; border-radius: 14px; margin-top: 14px;
            font-size: 14px; display: none;
        }
        .msg.success { background: #e8f5e9; color: #1e5a2f; display: block; }
        .msg.error { background: #fdecea; color: #c0392b; display: block; }

        .loading-bar {
            display: none; background: #f0f2f5;
            border-radius: 10px; overflow: hidden; height: 6px; margin-top: 10px;
        }
        .loading-bar.show { display: block; }
        .loading-bar-inner {
            height: 100%; background: #c0392b;
            width: 0%; transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="top-bar">
            <div class="logo">
                <i class="fas fa-arrows-retweet"></i>
                <h1>Demma<span>.</span></h1>
            </div>
            <div class="top-actions">
                <div id="langSelector"></div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> <span data-i18n="logout">Déconnexion</span>
                </button>
            </div>
        </div>

        <div class="card">
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img id="avatarImg" class="avatar-img" style="display:none;" alt="Avatar" />
                    <div id="avatarInitials" class="avatar-initials">?</div>
                    <label class="avatar-upload-btn" title="Changer la photo">
                        <i class="fas fa-camera"></i>
                        <input type="file" id="avatarInput" accept="image/*" />
                    </label>
                </div>
                <div class="user-name" id="userName">Chargement...</div>
                <div class="user-sub" id="userSub">—</div>

                <div class="loading-bar" id="uploadProgress">
                    <div class="loading-bar-inner" id="uploadProgressInner"></div>
                </div>
                <div class="msg" id="avatarMsg"></div>
            </div>

            <div class="info-row">
                <span class="info-label" data-i18n="field_gender">Sexe</span>
                <span class="info-value" id="userSexe">—</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="field_age">Âge</span>
                <span class="info-value" id="userAge">—</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="field_country">Pays</span>
                <span class="info-value" id="userPays">—</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="field_phone">Téléphone</span>
                <span class="info-value" id="userPhone">—</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="field_activity">Domaine</span>
                <span class="info-value" id="userDomaine">—</span>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-cog"></i> <span data-i18n="prof_settings">Paramètres du compte</span></h2>

            <div class="form-group">
                <label data-i18n="field_email">Adresse email (optionnelle)</label>
                <input type="email" id="emailInput" placeholder="exemple@demma.africa" />
            </div>

            <button class="btn-save" id="saveEmailBtn">
                <i class="fas fa-save"></i> <span data-i18n="btn_save_email">Enregistrer l'email</span>
            </button>

            <div class="msg" id="emailMsg"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script>
        renderLanguageSelector('langSelector');

        let currentUser = null;

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'connexion.html';
                return null;
            }
            return session.user;
        }

        async function loadProfile() {
            currentUser = await checkSession();
            if (!currentUser) return;

            document.getElementById('userPhone').textContent = currentUser.phone || '—';

            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error) { console.error(error); return; }

            document.getElementById('userName').textContent = data.nom;
            document.getElementById('userSub').textContent = data.domaine;
            document.getElementById('userSexe').textContent = data.sexe;
            document.getElementById('userAge').textContent = data.age + ' ans';
            document.getElementById('userPays').textContent = data.pays;
            document.getElementById('userDomaine').textContent = data.domaine;

            if (data.avatar_url) {
                document.getElementById('avatarImg').src = data.avatar_url;
                document.getElementById('avatarImg').style.display = 'block';
                document.getElementById('avatarInitials').style.display = 'none';
            } else {
                const initial = (data.nom || '?').charAt(0).toUpperCase();
                document.getElementById('avatarInitials').textContent = initial;
                document.getElementById('avatarImg').style.display = 'none';
                document.getElementById('avatarInitials').style.display = 'flex';
            }

            if (currentUser.email) {
                document.getElementById('emailInput').value = currentUser.email;
            }
        }

        document.getElementById('avatarInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const msg = document.getElementById('avatarMsg');
            const progressBar = document.getElementById('uploadProgress');
            const progressInner = document.getElementById('uploadProgressInner');
            msg.className = 'msg';

            if (file.size > 2 * 1024 * 1024) {
                msg.textContent = '❌ Photo trop lourde (max 2 Mo).';
                msg.classList.add('error');
                return;
            }
            if (!file.type.startsWith('image/')) {
                msg.textContent = '❌ Choisissez une image.';
                msg.classList.add('error');
                return;
            }

            progressBar.classList.add('show');
            progressInner.style.width = '20%';

            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `${currentUser.id}/avatar.${fileExt}`;

                progressInner.style.width = '50%';
                const { error: uploadError } = await supabaseClient
                    .storage.from('avatars')
                    .upload(fileName, file, { cacheControl: '3600', upsert: true });
                if (uploadError) throw uploadError;

                progressInner.style.width = '80%';

                const { data: urlData } = supabaseClient
                    .storage.from('avatars')
                    .getPublicUrl(fileName);

                const publicUrl = urlData.publicUrl + '?t=' + Date.now();

                const { error: updateError } = await supabaseClient
                    .from('profiles')
                    .update({ avatar_url: publicUrl })
                    .eq('id', currentUser.id);
                if (updateError) throw updateError;

                progressInner.style.width = '100%';

                document.getElementById('avatarImg').src = publicUrl;
                document.getElementById('avatarImg').style.display = 'block';
                document.getElementById('avatarInitials').style.display = 'none';

                setTimeout(() => {
                    progressBar.classList.remove('show');
                    progressInner.style.width = '0%';
                }, 800);

                msg.textContent = '✅ ' + t('success_avatar');
                msg.classList.add('success');

            } catch (error) {
                console.error(error);
                progressBar.classList.remove('show');
                msg.textContent = '❌ ' + error.message;
                msg.classList.add('error');
            }
        });

        document.getElementById('saveEmailBtn').addEventListener('click', async function() {
            const email = document.getElementById('emailInput').value.trim();
            const msg = document.getElementById('emailMsg');
            msg.className = 'msg';

            if (!email || !email.includes('@')) {
                msg.textContent = '❌ Email invalide.';
                msg.classList.add('error');
                return;
            }

            this.disabled = true;
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            const { error } = await supabaseClient.auth.updateUser({ email: email });

            if (error) {
                msg.textContent = '❌ ' + error.message;
                msg.classList.add('error');
            } else {
                msg.textContent = '✅ ' + t('success_email');
                msg.classList.add('success');
            }

            this.disabled = false;
            this.innerHTML = '<i class="fas fa-save"></i> <span>' + t('btn_save_email') + '</span>';
        });

        document.getElementById('logoutBtn').addEventListener('click', async function() {
            await supabaseClient.auth.signOut();
            window.location.href = 'connexion.html';
        });

        loadProfile();
    </script>
</body>
</html>
